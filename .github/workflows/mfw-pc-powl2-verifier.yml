name: MFW PC-POWL2 sealed verifier

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mfw-pc-powl2-verifier.yml]
  workflow_dispatch:

concurrency:
  group: mfw-sealed-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Sealed PC-POWL2 kernel verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Establish hosted-runner standing
        run: |
          set -euo pipefail
          date -u | tee runner.log
          uname -a | tee -a runner.log
          printf 'repository=%s\nref=%s\nsha=%s\nrun=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            | tee -a runner.log

      - name: Generate ephemeral key and receive sealed package
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/verifier-private.pem 2> key-generation.log
          openssl pkey -in /tmp/verifier-private.pem -pubout \
            -out /tmp/verifier-public.pem
          public_key_b64="$(base64 -w0 /tmp/verifier-public.pem)"
          body="MFW_SEALED_VERIFIER_KEY run=${GITHUB_RUN_ID}\n${public_key_b64}"
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/comment.json > key-comment-response.json

          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/agent/mfw-pc-powl2-verifier/.verifier/${GITHUB_RUN_ID}"
          for attempt in $(seq 1 360); do
            nonce="$(date +%s%N)"
            if curl -fsSL "${base}/sealed-key.b64?${nonce}" -o sealed-key.b64 \
              && curl -fsSL "${base}/payload.tar.enc.b64?${nonce}" -o payload.tar.enc.b64 \
              && curl -fsSL "${base}/manifest.sha256?${nonce}" -o manifest.sha256; then
              break
            fi
            printf 'waiting_for_sealed_payload attempt=%s\n' "$attempt"
            sleep 5
          done
          test -s sealed-key.b64
          test -s payload.tar.enc.b64
          base64 -d sealed-key.b64 > sealed-key.bin
          base64 -d payload.tar.enc.b64 > payload.tar.enc
          sha256sum --check manifest.sha256 | tee transport-integrity.log
          openssl pkeyutl -decrypt -inkey /tmp/verifier-private.pem \
            -in sealed-key.bin -out /tmp/verifier-passphrase \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir sealed-source
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass file:/tmp/verifier-passphrase -in payload.tar.enc \
            | tar -xz -C sealed-source
          test -f sealed-source/pc-powl2/PCPOWL2.lean
          find sealed-source/pc-powl2 -maxdepth 2 -type f -printf '%P\n' \
            | sort | tee sealed-manifest.log

      - name: Enforce source policy
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee pc-powl2-source-policy.log
          from pathlib import Path
          import re, sys
          root = Path('sealed-source/pc-powl2')
          files = sorted((root / 'PCPOWL2').rglob('*.lean'))
          errors = []
          rules = {
            'sorry': re.compile(r'\bsorry\b'),
            'admit': re.compile(r'\badmit\b'),
            'axiom': re.compile(r'(?m)^\s*axiom\b'),
            'opaque': re.compile(r'(?m)^\s*opaque\b'),
            'unsafe': re.compile(r'(?m)^\s*unsafe\b'),
          }
          for path in files:
            text = path.read_text()
            for label, rule in rules.items():
              if rule.search(text): errors.append(f'{path.relative_to(root)}: {label}')
          imports = set(re.findall(r'(?m)^import\s+([A-Za-z0-9_.]+)',
            (root / 'PCPOWL2.lean').read_text()))
          for path in files:
            module = '.'.join(path.relative_to(root).with_suffix('').parts)
            if not module.endswith('.Examples') and module not in imports:
              errors.append(f'missing import {module}')
          if errors:
            print('SOURCE POLICY: FAILURE')
            print('\n'.join(errors))
            sys.exit(1)
          print('SOURCE POLICY: ALIVE')
          print(f'production_modules={len(files)}')
          PY

      - name: Install Lean
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl git zstd
          curl https://elan.lean-lang.org/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and kernel-check
        working-directory: sealed-source/pc-powl2
        run: |
          set -o pipefail
          { elan --version; cat lean-toolchain; lean --version; lake --version; } \
            2>&1 | tee ../../pc-powl2-toolchain.log
          lake update 2>&1 | tee ../../pc-powl2-lake-update.log
          lake exe cache get 2>&1 | tee ../../pc-powl2-mathlib-cache.log
          lake build --wfail 2>&1 | tee ../../pc-powl2-build.log
          lake env leanchecker PCPOWL2 2>&1 | tee ../../pc-powl2-leanchecker.log
          lake env leanchecker Main 2>&1 | tee -a ../../pc-powl2-leanchecker.log
          lake exe pc_powl2_check 2>&1 | tee ../../pc-powl2-audit.log

      - name: Independently verify with nanoda
        working-directory: sealed-source/pc-powl2
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/leanprover/lean4export.git _lean4export
          cp lean-toolchain _lean4export/lean-toolchain
          (cd _lean4export && lake build)
          git clone --depth 1 --branch debug https://github.com/ammkrn/nanoda_lib.git _nanoda_lib
          (cd _nanoda_lib && cargo build --release)
          lake env _lean4export/.lake/build/bin/lean4export PCPOWL2 > _nanoda_export.txt
          cat > _nanoda_config.json <<'JSON'
          {"export_file_path":"_nanoda_export.txt","use_stdin":false,
           "permitted_axioms":["propext","Classical.choice","Quot.sound","Lean.trustCompiler"],
           "unpermitted_axiom_hard_error":true,"nat_extension":true,
           "string_extension":true,"print_success_message":true}
          JSON
          { printf 'export_bytes='; wc -c < _nanoda_export.txt;
            printf 'export_lines='; wc -l < _nanoda_export.txt;
            _nanoda_lib/target/release/nanoda_bin _nanoda_config.json; } \
            2>&1 | tee ../../pc-powl2-nanoda.log

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfw-pc-powl2-sealed-${{ github.run_id }}
          path: |
            runner.log
            key-generation.log
            key-comment-response.json
            transport-integrity.log
            sealed-manifest.log
            pc-powl2-source-policy.log
            pc-powl2-toolchain.log
            pc-powl2-lake-update.log
            pc-powl2-mathlib-cache.log
            pc-powl2-build.log
            pc-powl2-leanchecker.log
            pc-powl2-audit.log
            pc-powl2-nanoda.log
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy plaintext and private keys
        if: always()
        run: |
          rm -rf sealed-source sealed-key.* payload.tar.enc* manifest.sha256 \
            /tmp/verifier-private.pem /tmp/verifier-public.pem \
            /tmp/verifier-passphrase /tmp/comment.json
