name: MFW PC-POWL2 sealed verifier

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mfw-pc-powl2-verifier.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-sealed-package:
    name: Sealed PC-POWL2 kernel verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Establish hosted-runner standing
        run: |
          set -euo pipefail
          date -u | tee runner.log
          uname -a | tee -a runner.log
          printf 'repository=%s\nref=%s\nsha=%s\nrun=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            | tee -a runner.log

      - name: Generate ephemeral transport key and await sealed package
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/mfw-verifier-private.pem \
            2> key-generation.log
          openssl pkey -in /tmp/mfw-verifier-private.pem -pubout \
            -out /tmp/mfw-verifier-public.pem

          public_key_b64="$(base64 -w0 /tmp/mfw-verifier-public.pem)"
          body="MFW_SEALED_VERIFIER_KEY run=${GITHUB_RUN_ID}\n${public_key_b64}"
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/comment.json \
            > key-comment-response.json

          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/agent/mfw-pc-powl2-verifier/.verifier/${GITHUB_RUN_ID}"
          ready=false
          for attempt in $(seq 1 360); do
            nonce="$(date +%s%N)"
            if curl -fsSL "${base}/sealed-key.bin?${nonce}" -o sealed-key.bin \
              && curl -fsSL "${base}/payload.tar.enc?${nonce}" -o payload.tar.enc \
              && curl -fsSL "${base}/manifest.sha256?${nonce}" -o manifest.sha256; then
              ready=true
              break
            fi
            printf 'waiting_for_sealed_payload attempt=%s\n' "$attempt"
            sleep 5
          done
          test "$ready" = true

          sha256sum --check manifest.sha256 | tee transport-integrity.log
          openssl pkeyutl -decrypt \
            -inkey /tmp/mfw-verifier-private.pem \
            -in sealed-key.bin \
            -out /tmp/mfw-verifier-passphrase \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          mkdir sealed-source
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass file:/tmp/mfw-verifier-passphrase \
            -in payload.tar.enc \
            | tar -xz -C sealed-source
          test -f sealed-source/pc-powl2/PCPOWL2.lean
          find sealed-source/pc-powl2 -maxdepth 2 -type f -printf '%P\n' \
            | sort | tee sealed-manifest.log

      - name: Enforce source and proof-hole policy
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee pc-powl2-source-policy.log
          from pathlib import Path
          import re
          import sys

          root = Path('sealed-source/pc-powl2')
          source = root / 'PCPOWL2'
          aggregate = root / 'PCPOWL2.lean'
          errors = []
          lean_files = sorted(source.rglob('*.lean'))
          forbidden = {
              'sorry placeholder': re.compile(r'\bsorry\b'),
              'admit tactic': re.compile(r'\badmit\b'),
              'axiom declaration': re.compile(r'(?m)^\s*axiom\b'),
              'opaque declaration': re.compile(r'(?m)^\s*opaque\b'),
              'unsafe declaration': re.compile(r'(?m)^\s*unsafe\b'),
          }
          if not lean_files:
              errors.append('no Lean source modules found')
          for path in lean_files:
              text = path.read_text(encoding='utf-8')
              for label, pattern in forbidden.items():
                  if pattern.search(text):
                      errors.append(f'{path.relative_to(root)}: {label}')
          imports = set(re.findall(
              r'(?m)^import\s+([A-Za-z0-9_.]+)',
              aggregate.read_text(encoding='utf-8'),
          ))
          for path in lean_files:
              module = '.'.join(path.relative_to(root).with_suffix('').parts)
              if module.endswith('.Examples'):
                  continue
              if module not in imports:
                  errors.append(f'aggregate missing import {module}')
          if errors:
              print('SOURCE POLICY: FAILURE')
              print('\n'.join(f'- {error}' for error in errors))
              sys.exit(1)
          print('SOURCE POLICY: ALIVE')
          print(f'production_modules={len(lean_files)}')
          PY

      - name: Install Lean toolchain dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl git zstd
          curl https://elan.lean-lang.org/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies and build with warnings denied
        working-directory: sealed-source/pc-powl2
        run: |
          set -o pipefail
          {
            elan --version
            cat lean-toolchain
            lean --version
            lake --version
          } 2>&1 | tee ../../pc-powl2-toolchain.log
          lake update 2>&1 | tee ../../pc-powl2-lake-update.log
          lake exe cache get 2>&1 | tee ../../pc-powl2-mathlib-cache.log
          lake build --wfail 2>&1 | tee ../../pc-powl2-build.log

      - name: Replay compiled environments with leanchecker
        working-directory: sealed-source/pc-powl2
        run: |
          set -o pipefail
          lake env leanchecker PCPOWL2 2>&1 | tee ../../pc-powl2-leanchecker.log
          lake env leanchecker Main 2>&1 | tee -a ../../pc-powl2-leanchecker.log

      - name: Execute theorem and axiom inventory
        working-directory: sealed-source/pc-powl2
        run: |
          set -o pipefail
          lake exe pc_powl2_check 2>&1 | tee ../../pc-powl2-audit.log

      - name: Build and run independent nanoda checker
        working-directory: sealed-source/pc-powl2
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/leanprover/lean4export.git _lean4export
          cp lean-toolchain _lean4export/lean-toolchain
          (cd _lean4export && lake build)
          git clone --depth 1 --branch debug \
            https://github.com/ammkrn/nanoda_lib.git _nanoda_lib
          (cd _nanoda_lib && cargo build --release)
          lake env _lean4export/.lake/build/bin/lean4export PCPOWL2 \
            > _nanoda_export.txt
          cat > _nanoda_config.json <<'JSON'
          {
            "export_file_path": "_nanoda_export.txt",
            "use_stdin": false,
            "permitted_axioms": [
              "propext",
              "Classical.choice",
              "Quot.sound",
              "Lean.trustCompiler"
            ],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          JSON
          {
            printf 'export_bytes='; wc -c < _nanoda_export.txt
            printf 'export_lines='; wc -l < _nanoda_export.txt
            _nanoda_lib/target/release/nanoda_bin _nanoda_config.json
          } 2>&1 | tee ../../pc-powl2-nanoda.log

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfw-pc-powl2-sealed-verification-${{ github.run_id }}
          path: |
            runner.log
            key-generation.log
            key-comment-response.json
            transport-integrity.log
            sealed-manifest.log
            pc-powl2-source-policy.log
            pc-powl2-toolchain.log
            pc-powl2-lake-update.log
            pc-powl2-mathlib-cache.log
            pc-powl2-build.log
            pc-powl2-leanchecker.log
            pc-powl2-audit.log
            pc-powl2-nanoda.log
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy ephemeral plaintext and private keys
        if: always()
        run: |
          rm -rf \
            sealed-source \
            sealed-key.bin \
            payload.tar.enc \
            manifest.sha256 \
            /tmp/mfw-verifier-private.pem \
            /tmp/mfw-verifier-public.pem \
            /tmp/mfw-verifier-passphrase \
            /tmp/comment.json
